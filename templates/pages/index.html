{% extends "base.html" %}
{% block content %}

<!-- 背景 -->
<div id="background"></div>

<!-- 轨道舞台 -->
<div id="orbit-stage">
  <div id="orbit-system">
    <!-- 装饰环 -->
    <div class="orbit-ring ring-outer"></div>
    <div class="orbit-ring ring-inner"></div>

    <!-- 中心核心（咖啡杯） -->
    <div id="orbit-core">
      <div class="core-glow"></div>
      <div class="core-light"></div>
    </div>

    <!-- 照片层 - 3D 多层轨道 -->
    <div class="photo-layer" id="orbit-ring"></div>
  </div>
</div>


<!-- 底部缩略图栏 -->
<div class="thumbnail-bar" id="thumbnail-bar"></div>

<!-- 详情模态框 -->
<div class="detail-modal" id="detail-modal" aria-hidden="true">
  <div class="detail-backdrop" data-close="true"></div>
  <div class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <button class="detail-close" id="detail-close" type="button" aria-label="关闭详情">&times;</button>
    <div class="detail-content">
      <h2 class="detail-title" id="detail-title">照片详情</h2>
      <p class="detail-category" id="detail-category">Gallery</p>
      <p class="detail-description" id="detail-description">暂无描述</p>
      <div class="detail-meta">
        <div class="detail-date"><span>📅</span><span id="detail-date">未提供日期</span></div>
        <div class="detail-camera"><span>📷</span><span id="detail-camera">未提供设备</span></div>
        <div class="detail-location"><span>📍</span><span id="detail-location">未提供地点</span></div>
      </div>
      <div class="detail-tags" id="detail-tags"></div>
      <div class="detail-actions">
        <button class="action-btn" type="button">❤️ 收藏</button>
        <button class="action-btn" type="button">⬇️ 下载</button>
        <button class="action-btn" type="button">🔗 分享</button>
      </div>
    </div>
  </div>
</div>

<!-- 轨道示意图 -->
<div class="navigator" id="navigator">
  <canvas id="navigator-canvas"></canvas>
</div>

<!-- 控制面板 -->
<div class="control-panel">
  <div class="control-buttons">
    <button id="auto-rotate-btn">🔄 自动旋转</button>
    <button id="pause-btn">⏸️ 暂停</button>
  </div>
  <div class="control-sliders">
    <!-- 优化：增加了滑块组的视觉层次结构，引入图标和实时数值反馈，提升专业感 -->
    <div class="slider-group">
      <div class="slider-header">
        <label>
          <!-- 优化：引入精简的SVG图标，使视觉语义更清晰 -->
          <svg class="slider-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          速度
        </label>
        <span id="speed-value" class="slider-value">50%</span>
      </div>
      <!-- 优化：添加 custom-slider 类以便进行更深入的 CSS 样式定制 -->
      <input type="range" id="speed-slider" class="custom-slider" min="0" max="100" value="50">
    </div>
    
    <!-- 优化：为视角控制同样增加图标与数值实时反馈 -->
    <div class="slider-group">
      <div class="slider-header">
        <label>
          <svg class="slider-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          视角
        </label>
        <span id="view-value" class="slider-value">50°</span>
      </div>
      <input type="range" id="view-slider" class="custom-slider" min="0" max="100" value="50">
    </div>
  </div>
</div>

{% endblock %}
