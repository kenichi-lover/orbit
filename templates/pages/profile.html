<!-- templates/pages/profile.html -->
{% extends "base.html" %}
{% block content %}
<div style="padding: 100px 20px 40px; color: white; max-width: 1000px; margin: 0 auto;">
  <h1 style="font-size: 28px; margin-bottom: 24px;">个人中心</h1>
  <p style="opacity: 0.7; margin-bottom: 40px;">欢迎回来，{{ user.username }}</p>
  <div id="user-gallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
    <!-- JS 从 /api/images?user_name={{ user.username }} 加载 -->
  </div>
</div>
{% endblock %}
