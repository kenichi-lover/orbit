<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Orbit Gallery - 沉浸式图片浏览与叙事平台">
  <link rel="icon" href="data:,">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="Orbit Gallery - 沉浸式图片浏览与叙事平台">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>{{ title }}</title>

  <link rel="stylesheet" href="/static/css/tailwind.css">
  <link rel="stylesheet" href="/static/css/coffee.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/nav.css">
  <link rel="stylesheet" href="/static/css/orbit.css">
  <link rel="stylesheet" href="/static/css/components.css">
  {% block extra_css %}{% endblock %}
</head>

<body>

<!-- 顶部导航栏 -->
<header id="top-nav">
  <nav class="nav-inner">
    <!-- 左侧：主入口 -->
    <div class="nav-left">
      <div class="nav-search-box" id="nav-search-box">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="nav-search-input" placeholder="搜索相册、标签..." autocomplete="off" />
        <button class="nav-search-close" id="nav-search-close" title="关闭">&times;</button>
      </div>

      <a href="/" class="nav-link {% if active_page == 'explore' %}active{% endif %}" id="nav-explore">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        相册
      </a>

      <a href="/story" class="nav-link {% if active_page == 'story' %}active{% endif %}" id="nav-story">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        叙事
      </a>
    </div>

    <!-- 右侧：工具入口 -->
    <div class="nav-right">
      <button class="nav-icon-btn" id="nav-search-trigger" title="搜索">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="nav-icon-btn" id="nav-filter" title="筛选">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
      <button class="nav-icon-btn" id="nav-theme-toggle" title="切换主题">
        <svg class="nav-icon nav-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="nav-icon nav-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>

      {% if user %}
      <button class="nav-icon-btn" id="btn-upload-trigger" title="上传">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      {% endif %}

      <div class="nav-user-actions">
        {% if user %}
          <span class="nav-username">{{ user.username }}</span>
          <button class="nav-text-btn" id="btn-logout">退出</button>
        {% else %}
          <button class="nav-text-btn" id="btn-login" data-mode="login">登录</button>
          <button class="nav-text-btn" id="btn-register" data-mode="register">注册</button>
        {% endif %}
      </div>
    </div>
  </nav>
</header>

<main id="main-content">
  {% block content %}{% endblock %}
</main>

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal-panel">
    <button class="modal-close" id="btn-close-auth">&times;</button>
    <h2 class="modal-title" id="auth-title">登录</h2>
    <div class="form-error" id="auth-error"></div>

    <form id="auth-form" class="form">
      <!-- 修复：register-fields 移入 form 内部 -->
      <div class="form-group" id="register-fields" style="display: none;">
        <label class="form-label" for="modal-email">邮箱</label>
        <input type="email" id="modal-email" class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label" for="modal-username">用户名</label>
        <input type="text" id="modal-username" class="form-input" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="modal-password">密码</label>
        <input type="password" id="modal-password" class="form-input" required>
      </div>

      <button type="submit" class="btn-primary" id="auth-submit-btn">登录</button>
    </form>

    <p class="auth-switch">
      <span id="auth-switch-text">还没有账号？</span>
      <button class="text-link" id="auth-switch-btn" type="button">注册</button>
    </p>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal-panel modal-panel--wide">
    <button class="modal-close" id="btn-close-upload">&times;</button>
    <h2 class="modal-title">上传图片</h2>
    <div class="form-error" id="upload-error"></div>

    <form id="upload-form" class="form">
      <div class="form-group">
        <label class="form-label" for="upload-file">选择图片文件</label>
        <input type="file" id="upload-file" name="file" accept="image/*" required class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label" for="upload-title">标题 (可选)</label>
        <input type="text" id="upload-title" name="title" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label" for="upload-desc">描述 (可选)</label>
        <textarea id="upload-desc" name="description" class="form-input"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="upload-category">分类 (可选)</label>
        <input type="text" id="upload-category" name="category" placeholder="Gallery" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label" for="upload-tags">标签 (可选，逗号分隔)</label>
        <input type="text" id="upload-tags" name="tags" placeholder="旅行, 风景, 摄影" class="form-input">
      </div>
      <button type="submit" class="btn-primary">上传</button>
    </form>
  </div>
</div>

<!-- 用户数据注入 -->
<script type="text/plain" id="current-user-data">{{ user | default(none) | tojson }}</script>

<script src="/static/js/main.js" type="module"></script>
<script src="/static/js/auth.js" type="module"></script>
<script src="/static/js/upload.js" type="module"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
